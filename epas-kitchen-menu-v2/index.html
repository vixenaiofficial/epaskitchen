<!DOCTYPE html>
<html lang="en">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Lato', sans-serif;
  background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
  color: #ffffff;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #1a1a1a; }
::-webkit-scrollbar-thumb { background: #d4af37; border-radius: 3px; }
.header {
  background: linear-gradient(180deg, rgba(26,26,26,0.98) 0%, rgba(15,15,15,0.98) 100%);
  padding: 20px 16px;
  text-align: center;
  border-bottom: 3px solid #d4af37;
  position: relative;
  z-index: 100;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px rgba(212,175,55,0.2);
}
.logo-container {
  width: 100%;
  max-width: 380px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}
.logo-link {
  display: block;
  width: 100%;
  text-decoration: none;
  position: relative;
  z-index: 2;
}
.logo-img {

  height: 180px;
  border-radius: 50%;
  border: 3px solid #d4af37;

}
@keyframes logoFloat {

}
.contact-info { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font-size: 13px; margin-top: 14px; }
.contact-link { color: #d4af37; text-decoration: none; display: flex; align-items: center; gap: 6px; transition: all 0.3s; font-weight: 600; }

.search-container { padding: 12px 16px; background: rgba(10,10,10,0.4); backdrop-filter: blur(5px); }
.search-box {

}

.category-btn {

}
.category-btn:hover {
  background: rgba(26,26,26,0.8);
  border-color: #d4af37;

  box-shadow: 0 8px 20px rgba(212,175,55,0.2);
}
.category-btn.active {

  color: #1a1a1a;
  border-color: #d4af37;
  box-shadow: 0 8px 24px rgba(212,175,55,0.5);

}
.menu-container { padding: 16px 16px 80px 16px; max-width: 600px; margin: 0 auto; }
.category-section { margin-bottom: 40px; animation: slideUp 0.6s ease-out; }
@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.category-title {

  color: #d4af37;
  margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 3px solid #d4af37;

}
.menu-items { display: grid; gap: 16px; }
.menu-item {

}
.menu-item::before {
  content: '';

  pointer-events: none; z-index: 1;
}
.menu-item:hover {

}
.menu-item:hover::before { opacity: 1; }
.menu-item-image {

.menu-item-image img {

}
.silhouette-icon {

.cart-button {

@keyframes pulse {

}
.cart-modal {

  display: none; flex-direction: column;
  z-index: 200;

}
.cart-modal.show { display: flex; }
@keyframes slideIn {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
.cart-header {
  background: linear-gradient(180deg, rgba(26,26,26,0.98) 0%, rgba(15,15,15,0.98) 100%);

}
.cart-header h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: #d4af37; }
.close-cart { background: none; border: none; color: #d4af37; font-size: 24px; cursor: pointer; transition: all 0.3s; }
.close-cart:hover { color: #ffd700; transform: rotate(90deg); }
.cart-content { flex: 1; overflow-y: auto; padding: 16px; -webkit-overflow-scrolling: touch; }
.cart-items { display: flex; flex-direction: column; gap: 12px; }
.cart-item {
  background: rgba(26,26,26,0.6);

.cart-item-thumb {

.cart-item-info { flex: 1; }
.cart-item-name { font-weight: 600; color: #d4af37; margin-bottom: 4px; font-size: 14px; }
.cart-item-price { font-size: 12px; color: #b0b0b0; }
.cart-item-qty {

.cart-item-qty button {

.cart-item-qty button:hover { color: #ffd700; transform: scale(1.2); }
.cart-item-delete { background: none; border: none; color: #ff6b6b; cursor: pointer; font-size: 16px; transition: all 0.2s; }
.cart-item-delete:hover { color: #ff4444; transform: scale(1.15); }
.empty-cart { text-align: center; padding: 40px 20px; color: #888; }
.empty-cart i { font-size: 48px; margin-bottom: 16px; opacity: 0.5; }
#orderSummaryContainer { background: rgba(26,26,26,0.8); border-top: 2px solid #d4af37; padding: 16px; margin-top: auto; }
.order-summary { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.summary-row { display: flex; justify-content: space-between; font-size: 14px; color: #b0b0b0; }
.summary-row.total {

  padding-top: 10px; margin-top: 6px;
}
.checkout-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg, #d4af37 0%, #ffd700 100%);

  border: none; border-radius: 12px;
  font-size: 14px; font-weight: 700;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  text-transform: uppercase; letter-spacing: 1px;
  box-shadow: 0 4px 12px rgba(212,175,55,0.2);
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.checkout-btn:hover {
  background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(212,175,55,0.3);
}
.checkout-btn:active { transform: translateY(0); }
.toast {
  position: fixed; bottom: 100px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: rgba(0,0,0,0.9);
  color: #d4af37;
  padding: 14px 24px;
  border-radius: 25px;
  border: 1px solid #d4af37;
  font-size: 13px;
  z-index: 300;
  transition: all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  pointer-events: none;
  text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
let cart = JSON.parse(localStorage.getItem('epas_kitchen_cart')) || [];

const LOGO_PATH = 'images/epilog.jpg';

const menuData = {
  meals: [
    { name: 'Porridge and Turkey',         price: 10000, image: 'images/porridge-turkey.jpg',  icon: 'fa-solid fa-bowl-rice', desc: 'Smoky party porridge served with seasoned grilled turkey.' },
    { name: 'Jollof Rice with Turkey',     price: 10000, image: 'images/jollof-rice-turkey.jpg', icon: 'fa-solid fa-bowl-rice', desc: 'Smoky party jollof rice with seasoned grilled turkey.' },
    { name: 'Jollof Rice with Chicken',    price: 8500,  image: 'images/jollof-rice-chicken.JPG', icon: 'fa-solid fa-bowl-rice', desc: 'Smoky party jollof rice with crispy fried chicken.' },
    { name: 'Fried Rice with Turkey',      price: 12000, image: 'images/fried-rice-turkey.jpg',   icon: 'fa-solid fa-bowl-rice', desc: 'Classic fried rice loaded with veggies, served with turkey.' },
    { name: 'Fried Rice with Chicken',     price: 10000, image: 'images/fried-rice-chicken.JPG',  icon: 'fa-solid fa-bowl-rice', desc: 'Classic fried rice with crispy fried chicken.' },
    { name: 'Spaghetti & Chicken',         price: 8500,  image: 'images/spaghetti-chicken.jpg',   icon: 'fa-solid fa-bowl-rice', desc: 'Savoury spaghetti tossed in rich sauce, served with fried chicken.' },
    { name: 'Spaghetti & Turkey',          price: 10000, image: 'images/spaghetti-turkey.jpg',    icon: 'fa-solid fa-bowl-rice', desc: 'Savoury spaghetti tossed in rich sauce, served with grilled turkey.' }
  ],
  soups: [
    { name: 'Banga Soup with Catfish, Beef & Starch', price: 8500, image: 'images/banga-soup.jpg', icon: 'fa-solid fa-mug-hot', desc: 'Rich palm nut soup with catfish & beef, served with starch.' },
    { name: 'Yam & Garden Egg Sauce with Boiled Egg & Fish', price: 10000, image: 'images/yam-garden-egg-sauce.jpg', icon: 'fa-solid fa-egg', desc: 'Boiled yam with garden egg sauce, boiled egg & fish.' }
  ],
  sides: [
    { name: 'Fried Plantain', price: 1000, image: 'images/fried-plantain.jpg', icon: 'fa-solid fa-apple-whole', desc: 'Golden, sweet ripe plantain.' },
    { name: 'Coleslaw', price: 1500, image: 'images/coleslaw.jpg', icon: 'fa-solid fa-leaf', desc: 'Fresh creamy cabbage & carrot slaw.' }
  ],
  smallchops: [
    { name: 'Meat Pie',                      price: 1500, image: 'images/meat-pie.jpg', icon: 'fa-solid fa-pie', desc: '' },
    { name: 'Puff Puff',                     price: 500,  image: 'images/puff-puff.jpg', icon: 'fa-solid fa-cloud', desc: 'Soft, fluffy puff puff.' },
    { name: 'Small Chops (Cup)',             price: 1800, image: 'images/small-chops.JPG', icon: 'fa-solid fa-utensils', desc: '2 Puff-Puff, 1 Spring Roll, and 1 Samosa.' },
    { name: 'Small Chops Platter (Beef)',    price: 15000, image: 'images/small-chops.JPG', icon: 'fa-solid fa-utensils', desc: 'Platter of Small Chops with Fried Beef.' },
    { name: 'Small Chops Platter (Chicken)', price: 20000, image: 'images/small-chops.JPG', icon: 'fa-solid fa-utensils', desc: 'Platter of Small Chops with Fried Chicken.' },
    { name: 'Small Chops Platter (Turkey)',  price: 25000, image: 'images/small-chops.JPG', icon: 'fa-solid fa-utensils', desc: 'Platter of Small Chops with Turkey.' }
  ],
  cakes: [
    { name: 'Vanilla Cake', price: 1500, image: 'images/vanilla-cake.jpg', icon: 'fa-solid fa-cake-candles', desc: 'Soft, moist vanilla cake — perfect for celebrations.' }
  ],
  drinks: [
    { name: 'Coke',                       price: 500, image: 'images/coke.jpg',   icon: 'fa-solid fa-glass-water',  desc: 'Ice-cold soft drink.' },
    { name: 'Sprite',                     price: 500, image: 'images/sprite.jpg', icon: 'fa-solid fa-bottle-water', desc: 'Ice-cold soft drink.' },
    { name: 'Malt',                       price: 500, image: 'images/malt.jpg',   icon: 'fa-solid fa-glass-water',  desc: 'Refreshing malt beverage.' },
    { name: 'Freshly Squeezed Pineapple Juice', price: 1500, image: 'images/pineapple-juice.jpg', icon: 'fa-solid fa-glass-water', desc: 'Fresh pineapple juice.' },
    { name: 'Freshly Made Juices',        price: 1500, image: 'images/fresh-juice.jpg', icon: 'fa-solid fa-glass-water', desc: 'Selection of fresh tropical juices.' },
    { name: 'Zobo Drink',                 price: 1500, image: 'images/zobo.jpg',  icon: 'fa-solid fa-glass-water',  desc: 'Traditional zobo drink.' }
  ]
};

const CATEGORY_TITLES = { meals: 'Meals', soups: 'Soups', sides: 'Sides', smallchops: 'Small Chops', cakes: 'Cakes', drinks: 'Drinks' };
const allItems = Object.values(menuData).flat();

/* Fallback chain: exact file -> swapped .jpg/.JPG case -> logo -> icon */
function handleImageError(img) {
  const src = img.getAttribute('src') || '';
  if (!img.dataset.caseTried && /\.jpe?g$/i.test(src)) {
    img.dataset.caseTried = '1';
    const i = src.lastIndexOf('.');
    const ext = src.slice(i);
    img.src = src.slice(0, i) + (ext === '.jpg' ? '.JPG' : '.jpg');
    return;
  }
  if (!img.dataset.logoTried) {
    img.dataset.logoTried = '1';
    img.classList.add('fallback');
    img.src = LOGO_PATH;
    return;
  }
  const icon = img.dataset.icon || 'fa-solid fa-utensils';
  img.outerHTML = '<i class="silhouette-icon ' + icon + '"></i>';
}

function itemCard(item) {
  const qty = cart.find(i => i.name === item.name)?.qty || 0;
  return `
  <div class="menu-item">
    <div class="menu-item-image">
      <img src="${item.image}" alt="${item.name}" loading="lazy" decoding="async"
           data-icon="${item.icon}" onerror="handleImageError(this)">
    </div>
    <div class="menu-item-content">
      <div class="menu-item-header">
        <div class="menu-item-name">${item.name}</div>
        <div class="menu-item-price">₦${item.price.toLocaleString()}</div>
      </div>
      <div class="menu-item-description">${item.desc || ''}</div>
      <div class="menu-item-controls">
        ${qty > 0 ? `
        <div class="quantity-control">
          <button class="qty-btn" onclick="decrementQty('${item.name}')">−</button>
          <span class="qty-display">${qty}</span>
          <button class="qty-btn" onclick="incrementQty('${item.name}')">+</button>
        </div>` : ''}
        <button class="buy-btn" onclick="addToCart('${item.name}', ${item.price})">
          ${qty > 0 ? 'Add More' : 'Add to Order'}
        </button>
      </div>
    </div>
  </div>`;
}

function generateHTML(items, category) {
  if (items.length === 0) {
    return '<div style="text-align: center; color: #888; padding: 40px 20px;"><i class="fas fa-search" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i><p>No items found</p></div>';
  }
  if (category === 'all') {
    const grouped = {};
    items.forEach(item => {
      for (const [cat, catItems] of Object.entries(menuData)) {
        if (catItems.find(i => i.name === item.name)) {
          if (!grouped[cat]) grouped[cat] = [];
          grouped[cat].push(item);
          return;
        }
      }
    });
    return Object.entries(grouped).map(([cat, catItems]) => `
      <div class="category-section">
        <div class="category-title">${CATEGORY_TITLES[cat] || cat}</div>
        <div class="menu-items">${catItems.map(itemCard).join('')}</div>
      </div>`).join('');
  }
  return `
    <div class="category-section">
      <div class="menu-items">${items.map(itemCard).join('')}</div>
    </div>`;
}

function renderMenu(category = 'all') {
  const items = category === 'all' ? allItems : (menuData[category] || []);
  document.getElementById('menuContent').innerHTML = generateHTML(items, category);
}

function saveCart() { localStorage.setItem('epas_kitchen_cart', JSON.stringify(cart)); }

function addToCart(name, price) {
  const existingItem = cart.find(item => item.name === name);
  if (existingItem) existingItem.qty++;
  else cart.push({ name, price, qty: 1 });
  saveCart();
  updateCart();
  updateItemDisplay(name);
  showToast(`${name} added! 👍`);
}

function incrementQty(name) {
  const item = cart.find(i => i.name === name);
  if (item) {
    item.qty++;
    saveCart();
    updateCart();
    /* Fix for flash issue: Only update the specific item's display instead of re-rendering entire menu */
    updateItemDisplay(name);
  }
}

function decrementQty(name) {
  const item = cart.find(i => i.name === name);
  if (item) {
    item.qty--;
    if (item.qty <= 0) cart = cart.filter(i => i.name !== name);
  }
  saveCart();
  updateCart();
  /* Fix for flash issue: Only update the specific item's display instead of re-rendering entire menu */
  updateItemDisplay(name);
}

/* Helper function to update just the item's quantity display without full menu re-render */
function updateItemDisplay(name) {
  const item = cart.find(i => i.name === name);
  const menuItems = document.querySelectorAll('.menu-item');
  menuItems.forEach(el => {
    const itemName = el.querySelector('.menu-item-name')?.textContent;
    if (itemName === name) {
      const controls = el.querySelector('.menu-item-controls');
      const qtyControl = controls.querySelector('.quantity-control');
      const qtyDisplay = controls.querySelector('.qty-display');
      const buyBtn = controls.querySelector('.buy-btn');
      
      if (!item || item.qty <= 0) {
        /* Remove quantity control and show only buy button */
        if (qtyControl) qtyControl.remove();
        if (!buyBtn) {
          controls.innerHTML = `<button class="buy-btn" onclick="addToCart('${name}', ${JSON.stringify(allItems.find(i => i.name === name)?.price || 0)})">Add to Order</button>`;
        }
      } else {
        /* First item - show quantity controls */
        if (!qtyControl) {
          const price = allItems.find(i => i.name === name)?.price || 0;
          controls.innerHTML = `
            <div class="quantity-control">
              <button class="qty-btn" onclick="decrementQty('${name}')">−</button>
              <div class="qty-display">${item.qty}</div>
              <button class="qty-btn" onclick="incrementQty('${name}')">+</button>
            </div>
            <button class="buy-btn" onclick="addToCart('${name}', ${price})">Add More</button>
          `;
        } else {
          /* Update existing quantity display smoothly */
          if (qtyDisplay) qtyDisplay.textContent = item.qty;
        }
      }
    }
  });
}

function removeFromCart(name) {
  cart = cart.filter(item => item.name !== name);
  saveCart(); updateCart(); renderCart();
}

function getActiveCategory() { return document.querySelector('.category-btn.active').dataset.category; }

function updateCart() {
  const badge = document.getElementById('cartBadge');
  const total = cart.reduce((sum, item) => sum + item.qty, 0);
  if (total > 0) { badge.textContent = total; badge.style.display = 'flex'; }
  else badge.style.display = 'none';
}

function renderCart() {
  const container = document.getElementById('cartItemsContainer');
  const summaryContainer = document.getElementById('orderSummaryContainer');
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="empty-cart">
        <i class="fas fa-shopping-bag"></i>
        <p>Your cart is empty</p>
        <p style="font-size: 12px; margin-top: 8px;">Start adding items to your order</p>
      </div>`;
    summaryContainer.style.display = 'none';
    return;
  }
  summaryContainer.style.display = 'block';
  container.innerHTML = `
    <div class="cart-items">
      ${cart.map(item => {
        const total = item.price * item.qty;
        const meta = allItems.find(i => i.name === item.name);
        const thumb = meta ? meta.image : '';
        return `
        <div class="cart-item">
          <img class="cart-item-thumb" src="${thumb}" alt="" loading="lazy" onerror="this.style.display='none'">
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">₦${item.price.toLocaleString()} × ${item.qty} = ₦${total.toLocaleString()}</div>
          </div>
          <div class="cart-item-qty">
            <button onclick="updateQty('${item.name}', -1)">−</button>
            <span style="width: 24px; text-align: center; font-size: 13px;">${item.qty}</span>
            <button onclick="updateQty('${item.name}', 1)">+</button>
          </div>
          <button class="cart-item-delete" onclick="removeFromCart('${item.name}')"><i class="fas fa-trash"></i></button>
        </div>`;
      }).join('')}
    </div>`;
  updateSummary();
}

function updateQty(name, change) {
  const item = cart.find(i => i.name === name);
  if (item) {
    item.qty += change;
    if (item.qty <= 0) removeFromCart(name);
    else { saveCart(); renderCart(); }
  }
  updateCart();
}

function updateSummary() {
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const deliveryFee = 500;
  document.getElementById('subtotal').textContent = subtotal.toLocaleString();
  document.getElementById('deliveryFee').textContent = deliveryFee.toLocaleString();
  document.getElementById('total').textContent = (subtotal + deliveryFee).toLocaleString();
}

function openCart() { renderCart(); document.getElementById('cartModal').classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeCart() { document.getElementById('cartModal').classList.remove('show'); document.body.style.overflow = 'auto'; }

function sendToWhatsApp() {
  if (cart.length === 0) { showToast('Cart is empty!'); return; }
  const subtotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
  const deliveryFee = 500;
  const total = subtotal + deliveryFee;
  const lines = [];
  lines.push("🍽️ *EPA'S KITCHEN ORDER* 🍽️");
  lines.push('*Order Details:*');
  lines.push('━━━━━━━━━━━━━━━━━━━━');
  cart.forEach(item => {
    lines.push(`📌 ${item.name}`);
    lines.push(`   ₦${item.price.toLocaleString()} × ${item.qty} = ₦${(item.price * item.qty).toLocaleString()}`);
  });
  lines.push('━━━━━━━━━━━━━━━━━━━━');
  lines.push(`*Subtotal:* ₦${subtotal.toLocaleString()}`);
  lines.push(`*Delivery Fee:* ₦${deliveryFee.toLocaleString()}`);
  lines.push(`*TOTAL: ₦${total.toLocaleString()}*`);
  lines.push('✨ Quality Food, Premium Service ✨');
  lines.push("Thank you for ordering from EPA's Kitchen!");
  window.open('https://wa.me/27628448071?text=' + encodeURIComponent(lines.join('\n')), '_blank');
  showToast('Order sent to WhatsApp! 🚀');
  setTimeout(() => {
    cart = [];
    localStorage.removeItem('epas_kitchen_cart');
    updateCart(); closeCart(); renderMenu(getActiveCategory());
  }, 1000);
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

document.querySelectorAll('.category-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderMenu(btn.dataset.category);
  });
});

document.getElementById('searchInput').addEventListener('input', (e) => {
  const query = e.target.value.toLowerCase();
  const filtered = allItems.filter(item => item.name.toLowerCase().includes(query));
  document.getElementById('menuContent').innerHTML = generateHTML(filtered, 'all');
});

document.getElementById('cartModal').addEventListener('click', (e) => {
  if (e.target.id === 'cartModal') closeCart();
});

updateCart();
renderMenu();
</script>
</body>
</html>
